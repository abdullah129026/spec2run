name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # without this, setup-python looks for requirements.txt at the
          # repo root (there is none) and the cache never restores
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest tests -q
      - run: ruff check backend/ --select F
      - run: python -m compileall backend/app
      - run: pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt -r backend/requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run typecheck
      # typecheck alone cannot catch build-time failures (bad page exports,
      # prerender errors); the deployed artifact must actually build.
      - run: cd frontend && npm run build
      # non-blocking: surfaces new advisories without failing the build
      - run: cd frontend && npm audit --audit-level=high
        continue-on-error: true
